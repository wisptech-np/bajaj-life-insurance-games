<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" width="1080" height="1920" role="img" aria-label="Three taut cables strung between anchor pylons above a night skyline">
  <title>Tightrope Protection — intro backdrop</title>
  <desc>Flat vector night cityscape at altitude. Two parallax skyline bands under a deep-blue sky, three taut steel cables strung between lattice anchor pylons, the middle cable lit in brand orange with a balance-pole walker on it. Bajaj Life palette.</desc>

  <defs>
    <linearGradient id="tpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030913"/>
      <stop offset="0.32" stop-color="#04122B"/>
      <stop offset="0.62" stop-color="#071B3E"/>
      <stop offset="0.86" stop-color="#0A2450"/>
      <stop offset="1" stop-color="#0B2E6B"/>
    </linearGradient>

    <radialGradient id="tpBloom" cx="0.62" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#F26522" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#F26522" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tpAbyss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060F" stop-opacity="0"/>
      <stop offset="1" stop-color="#01040A" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="tpRope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F26522" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FF8A45"/>
      <stop offset="1" stop-color="#F26522" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1080" height="1920" fill="url(#tpSky)"/>
  <ellipse cx="670" cy="1290" rx="760" ry="420" fill="url(#tpBloom)"/>

  <!-- Star field: sparse, cool, low contrast so the foreground stays dominant -->
  <g fill="#A9C2E8" opacity="0.35">
    <circle cx="118" cy="188" r="2.2"/><circle cx="322" cy="112" r="1.6"/>
    <circle cx="510" cy="240" r="2.6"/><circle cx="742" cy="150" r="1.8"/>
    <circle cx="906" cy="300" r="2.2"/><circle cx="212" cy="392" r="1.5"/>
    <circle cx="640" cy="430" r="1.9"/><circle cx="978" cy="520" r="1.6"/>
    <circle cx="404" cy="560" r="1.4"/><circle cx="836" cy="640" r="1.8"/>
  </g>

  <!-- Far skyline band -->
  <g fill="#081C40" opacity="0.8">
    <rect x="-20" y="1128" width="118" height="220"/>
    <rect x="112" y="1052" width="86" height="296"/>
    <rect x="212" y="1170" width="132" height="178"/>
    <rect x="358" y="1004" width="96" height="344"/>
    <rect x="468" y="1146" width="112" height="202"/>
    <rect x="594" y="1068" width="80" height="280"/>
    <rect x="688" y="1188" width="140" height="160"/>
    <rect x="842" y="1030" width="98" height="318"/>
    <rect x="954" y="1150" width="146" height="198"/>
  </g>
  <g fill="#F26522" opacity="0.16">
    <rect x="140" y="1110" width="10" height="8"/><rect x="164" y="1178" width="10" height="8"/>
    <rect x="386" y="1064" width="10" height="8"/><rect x="418" y="1152" width="10" height="8"/>
    <rect x="616" y="1128" width="10" height="8"/><rect x="870" y="1092" width="10" height="8"/>
    <rect x="902" y="1188" width="10" height="8"/><rect x="500" y="1206" width="10" height="8"/>
  </g>

  <!-- Near skyline band -->
  <g fill="#040F26">
    <rect x="-30" y="1272" width="164" height="380"/>
    <rect x="150" y="1200" width="104" height="452"/>
    <rect x="272" y="1330" width="188" height="322"/>
    <rect x="478" y="1174" width="118" height="478"/>
    <rect x="612" y="1298" width="152" height="354"/>
    <rect x="780" y="1226" width="110" height="426"/>
    <rect x="906" y="1320" width="200" height="332"/>
  </g>
  <g fill="#F26522" opacity="0.22">
    <rect x="176" y="1246" width="12" height="9"/><rect x="212" y="1318" width="12" height="9"/>
    <rect x="176" y="1390" width="12" height="9"/><rect x="504" y="1222" width="12" height="9"/>
    <rect x="548" y="1300" width="12" height="9"/><rect x="504" y="1378" width="12" height="9"/>
    <rect x="806" y="1272" width="12" height="9"/><rect x="846" y="1350" width="12" height="9"/>
    <rect x="330" y="1392" width="12" height="9"/><rect x="660" y="1360" width="12" height="9"/>
  </g>

  <!-- Anchor pylons: lattice towers the cables terminate on -->
  <g stroke="#123566" stroke-width="5" fill="none" opacity="0.95">
    <path d="M96 1920 L140 1006 M228 1920 L184 1006"/>
    <path d="M116 1820 L208 1820 M126 1700 L198 1700 M134 1580 L190 1580 M142 1460 L182 1460 M148 1340 L176 1340 M152 1220 L172 1220 M156 1110 L168 1110"/>
    <path d="M900 1920 L940 1058 M1024 1920 L984 1058"/>
    <path d="M918 1820 L1006 1820 M928 1700 L996 1700 M936 1580 L988 1580 M944 1460 L980 1460 M950 1340 L974 1340 M956 1224 L968 1224"/>
  </g>
  <g fill="#0D2A58">
    <rect x="130" y="988" width="64" height="16"/>
    <rect x="930" y="1040" width="64" height="16"/>
  </g>
  <g fill="#F26522">
    <rect x="130" y="982" width="64" height="6"/>
    <rect x="930" y="1034" width="64" height="6"/>
  </g>
  <g fill="#FFC845" opacity="0.2">
    <circle cx="162" cy="964" r="22"/><circle cx="962" cy="1016" r="22"/>
  </g>
  <g fill="#FFC845">
    <circle cx="162" cy="964" r="7"/><circle cx="962" cy="1016" r="7"/>
  </g>

  <!-- Depth haze under the lowest cable -->
  <rect x="0" y="1500" width="1080" height="420" fill="url(#tpAbyss)"/>

  <!-- Three taut cables. Middle one is lit: that is the one you are on. -->
  <g stroke-linecap="round">
    <path d="M162 1236 L962 1288" stroke="#02060F" stroke-width="9" opacity="0.9"/>
    <path d="M162 1232 L962 1284" stroke="#7E97BB" stroke-width="4" opacity="0.55"/>

    <path d="M162 1400 L962 1452" stroke="#02060F" stroke-width="12" opacity="0.95"/>
    <path d="M162 1394 L962 1446" stroke="url(#tpRope)" stroke-width="7"/>
    <path d="M162 1388 L962 1440" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

    <path d="M162 1566 L962 1618" stroke="#02060F" stroke-width="12" opacity="0.95"/>
    <path d="M162 1562 L962 1614" stroke="#7E97BB" stroke-width="5" opacity="0.7"/>
  </g>

  <!-- Cable eyelets -->
  <g fill="#1E56B4">
    <circle cx="162" cy="1234" r="9"/><circle cx="162" cy="1392" r="10"/><circle cx="162" cy="1564" r="10"/>
    <circle cx="962" cy="1286" r="9"/><circle cx="962" cy="1444" r="10"/><circle cx="962" cy="1616" r="10"/>
  </g>

  <!-- Walker silhouette on the lit cable: light value against a dark ground -->
  <g transform="translate(430 1408)">
    <path d="M-92 -78 L92 -78" stroke="#F26522" stroke-width="12" stroke-linecap="round"/>
    <g fill="#F26522">
      <circle cx="-92" cy="-78" r="11"/><circle cx="92" cy="-78" r="11"/>
    </g>
    <path d="M-18 -76 L0 -66 L18 -76" stroke="#EDF3FF" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-16 -62 Q-20 -30 -14 -2 L14 -2 Q20 -30 16 -62 Z" fill="#EDF3FF"/>
    <path d="M-16 -52 L16 -34" stroke="#003DA6" stroke-width="9" stroke-linecap="round"/>
    <circle cx="2" cy="-86" r="16" fill="#F3D2AE"/>
    <path d="M-14 -88 a16 16 0 0 1 32 0 Z" fill="#003DA6"/>
    <path d="M0 -2 L-20 4 M0 -2 L20 4" stroke="#0A2C6B" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="-20" cy="4" rx="11" ry="6" fill="#FFC845"/>
    <ellipse cx="20" cy="4" rx="11" ry="6" fill="#FFC845"/>
  </g>

  <!-- Vignette so UI text sits on quiet ground -->
  <rect x="0" y="0" width="1080" height="480" fill="#04122B" opacity="0.55"/>
  <rect x="0" y="1640" width="1080" height="280" fill="#01040A" opacity="0.65"/>
</svg>
