<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice" width="1080" height="1920" role="img" aria-label="Dusk city skyline at twilight">
  <title>Tightrope Protection — intro backdrop</title>
  <desc>Flat vector dusk cityscape. Three parallax skyline bands over a flat ground plane, Bajaj Life palette. No wire or rope: this game plays on flat ground.</desc>

  <defs>
    <!-- Sky: deep navy overhead easing into brand blue, then a warm horizon. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#070E1C"/>
      <stop offset="0.34" stop-color="#0B1221"/>
      <stop offset="0.68" stop-color="#0A2A66"/>
      <stop offset="0.88" stop-color="#123C8F"/>
      <stop offset="1"    stop-color="#1E56B4"/>
    </linearGradient>

    <!-- Warm sunset bloom sitting on the horizon line. -->
    <radialGradient id="glow" cx="0.5" cy="1" r="0.72">
      <stop offset="0"   stop-color="#F26522" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#F2872B" stop-opacity="0.34"/>
      <stop offset="1"   stop-color="#F26522" stop-opacity="0"/>
    </radialGradient>

    <!-- Parallax bands: flatter and hazier toward the back. -->
    <linearGradient id="bandFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4E96"/>
      <stop offset="1" stop-color="#1B3A72"/>
    </linearGradient>
    <linearGradient id="bandMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14306B"/>
      <stop offset="1" stop-color="#0D2049"/>
    </linearGradient>
    <linearGradient id="bandNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1733"/>
      <stop offset="1" stop-color="#060D1E"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#081128"/>
      <stop offset="0.5" stop-color="#0B1221"/>
      <stop offset="1"   stop-color="#05090F"/>
    </linearGradient>

    <!-- Keeps the centre calm so title and CTA stay legible. -->
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0"    stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <ellipse cx="540" cy="1205" rx="820" ry="330" fill="url(#glow)"/>

  <!-- Far skyline — low contrast, hazy, baseline y=1205 -->
  <g fill="url(#bandFar)" opacity="0.55">
    <rect x="-10"  y="1096" width="78"  height="112"/>
    <rect x="74"   y="1042" width="52"  height="166"/>
    <rect x="132"  y="1108" width="66"  height="100"/>
    <rect x="204"  y="1004" width="46"  height="204"/>
    <rect x="256"  y="1082" width="72"  height="126"/>
    <rect x="334"  y="1054" width="54"  height="154"/>
    <rect x="394"  y="1116" width="80"  height="92"/>
    <rect x="480"  y="1020" width="50"  height="188"/>
    <rect x="536"  y="1088" width="68"  height="120"/>
    <rect x="610"  y="1048" width="58"  height="160"/>
    <rect x="674"  y="1110" width="74"  height="98"/>
    <rect x="754"  y="1030" width="48"  height="178"/>
    <rect x="808"  y="1094" width="70"  height="114"/>
    <rect x="884"  y="1060" width="56"  height="148"/>
    <rect x="946"  y="1104" width="82"  height="104"/>
    <rect x="1034" y="1072" width="56"  height="136"/>
  </g>

  <!-- Mid skyline — baseline y=1330 -->
  <g fill="url(#bandMid)" opacity="0.9">
    <rect x="-16"  y="1178" width="104" height="154"/>
    <rect x="94"   y="1112" width="70"  height="220"/>
    <rect x="170"  y="1206" width="92"  height="126"/>
    <rect x="268"  y="1142" width="64"  height="190"/>
    <rect x="338"  y="1224" width="108" height="108"/>
    <rect x="452"  y="1160" width="72"  height="172"/>
    <rect x="530"  y="1096" width="58"  height="236"/>
    <rect x="594"  y="1198" width="96"  height="134"/>
    <rect x="696"  y="1150" width="68"  height="182"/>
    <rect x="770"  y="1218" width="102" height="114"/>
    <rect x="878"  y="1134" width="66"  height="198"/>
    <rect x="950"  y="1212" width="88"  height="120"/>
    <rect x="1044" y="1168" width="52"  height="164"/>
  </g>

  <!-- Near skyline — darkest, highest contrast, baseline y=1476 -->
  <g fill="url(#bandNear)">
    <rect x="-20"  y="1300" width="132" height="180"/>
    <rect x="118"  y="1236" width="86"  height="244"/>
    <rect x="210"  y="1328" width="118" height="152"/>
    <rect x="334"  y="1268" width="78"  height="212"/>
    <rect x="418"  y="1344" width="136" height="136"/>
    <rect x="560"  y="1284" width="84"  height="196"/>
    <rect x="650"  y="1216" width="70"  height="264"/>
    <rect x="726"  y="1318" width="124" height="162"/>
    <rect x="856"  y="1262" width="80"  height="218"/>
    <rect x="942"  y="1336" width="158" height="144"/>
  </g>

  <!-- Flat ground plane. Deliberately empty — this game runs on flat ground. -->
  <rect x="0" y="1470" width="1080" height="450" fill="url(#ground)"/>
  <rect x="0" y="1470" width="1080" height="3" fill="#1E56B4" opacity="0.35"/>

  <rect width="1080" height="1920" fill="url(#vignette)"/>
</svg>
